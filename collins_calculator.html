<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oak & Cedar Revenue Calculator</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef2ee, #dfe6df);
    color: #202820;
}

.container {
    max-width: 500px;
    margin: auto;
}

/* LOGO */

.logo {
    text-align: center;
    margin-bottom: 20px;
}

.logo-icon {
    width: 80px;
    height: 80px;
    margin: auto;
    background: linear-gradient(135deg, #24452d, #6b8e58);
    border-radius: 50% 50% 45% 45%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    border: 4px solid white;
}

.logo h1 {
    margin: 12px 0 3px;
    font-size: 25px;
    letter-spacing: 1px;
}

.logo p {
    margin: 0;
    color: #667066;
    font-size: 14px;
}

/* MAIN CARD */

.card {
    background: white;
    padding: 22px;
    border-radius: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.10);
}

/* INPUTS */

.section-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 15px;
}

label {
    display: block;
    margin-top: 14px;
    margin-bottom: 6px;
    font-size: 14px;
    font-weight: bold;
    color: #394439;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #d5dcd5;
    border-radius: 12px;
    font-size: 17px;
    outline: none;
    background: #f8faf8;
}

input:focus {
    border: 2px solid #547a59;
    background: white;
}

/* BUTTONS */

button {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.calculate {
    background: linear-gradient(135deg, #24452d, #527a58);
    color: white;
    box-shadow: 0 6px 15px rgba(36,69,45,0.25);
}

.reset {
    background: #edf0ed;
    color: #394439;
}

/* RESULTS */

.results {
    margin-top: 25px;
    padding: 18px;
    background: #f4f7f4;
    border-radius: 16px;
    border: 1px solid #e0e6e0;
}

.results h2 {
    text-align: center;
    margin-top: 0;
    font-size: 19px;
}

.result-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #dde3dd;
    font-size: 15px;
}

.result-row:last-child {
    border-bottom: none;
}

.value {
    font-weight: bold;
}

.profit-box {
    margin-top: 15px;
    padding: 18px;
    border-radius: 14px;
    background: #24452d;
    color: white;
    text-align: center;
}

.profit-label {
    font-size: 14px;
}

.profit {
    font-size: 28px;
    font-weight: bold;
    margin-top: 6px;
}

.footer {
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
    color: #687268;
}

</style>

</head>

<body>

<div class="container">

<!-- LOGO -->

<div class="logo">

    <div class="logo-icon">
        🌳
    </div>

    <h1>OAK &amp; CEDAR</h1>

    <p>Revenue Calculator</p>

</div>


<div class="card">

<div class="section-title">
Business Information
</div>


<label>Bank 1 (&#8373;)</label>
<input type="number" id="bank1" placeholder="Enter amount">


<label>Bank 2 (&#8373;)</label>
<input type="number" id="bank2" placeholder="Enter amount">


<label>Bank 3 (&#8373;)</label>
<input type="number" id="bank3" placeholder="Enter amount">


<label>Cash at Hand (&#8373;)</label>
<input type="number" id="cash" placeholder="Enter amount">


<label>Total Goods (&#8373;)</label>
<input type="number" id="totalGoods" placeholder="Enter amount">


<label>Remaining Goods (&#8373;)</label>
<input type="number" id="remainingGoods" placeholder="Enter amount">


<label>Expenses (&#8373;)</label>
<input type="number" id="expenses" placeholder="Enter amount">


<button class="calculate" onclick="calculateProfit()">
    CALCULATE REVENUE
</button>


<button class="reset" onclick="resetCalculator()">
    RESET
</button>


<!-- RESULTS -->

<div class="results">

<h2>CALCULATION RESULTS</h2>


<div class="result-row">
<span>Total Banks</span>
<span class="value">&#8373; <span id="totalBanks">0</span></span>
</div>


<div class="result-row">
<span>Total Bank &amp; Cash</span>
<span class="value">&#8373; <span id="totalCash">0</span></span>
</div>


<div class="result-row">
<span>Remaining Goods</span>
<span class="value">&#8373; <span id="remaining">0</span></span>
</div>


<div class="result-row">
<span>Goods After Expenses</span>
<span class="value">&#8373; <span id="goodsAfterExpenses">0</span></span>
</div>


<div class="profit-box">

<div class="profit-label">
TOTAL PROFIT
</div>

<div class="profit">
&#8373; <span id="profit">0</span>
</div>

</div>

</div>

</div>


<div class="footer">
Oak &amp; Cedar • Business Revenue Management
</div>

</div>


<script>

function calculateProfit() {

    var bank1 =
        Number(document.getElementById("bank1").value) || 0;

    var bank2 =
        Number(document.getElementById("bank2").value) || 0;

    var bank3 =
        Number(document.getElementById("bank3").value) || 0;

    var cash =
        Number(document.getElementById("cash").value) || 0;

    var totalGoods =
        Number(document.getElementById("totalGoods").value) || 0;

    var remainingGoods =
        Number(document.getElementById("remainingGoods").value) || 0;

    var expenses =
        Number(document.getElementById("expenses").value) || 0;


    /* TOTAL BANKS */

    var totalBanks =
        bank1 + bank2 + bank3;


    /* TOTAL CASH */

    var totalCash =
        totalBanks + cash;


    /* GOODS AFTER EXPENSES */

    var goodsAfterExpenses =
        totalGoods - expenses;


    /* PROFIT */

    var profit =
        totalCash + remainingGoods - goodsAfterExpenses;


    /* PREVENT NEGATIVE PROFIT */

    if (profit < 0) {
        profit = 0;
    }


    /* DISPLAY RESULTS */

    document.getElementById("totalBanks").textContent =
        totalBanks.toLocaleString();


    document.getElementById("totalCash").textContent =
        totalCash.toLocaleString();


    document.getElementById("remaining").textContent =
        remainingGoods.toLocaleString();


    document.getElementById("goodsAfterExpenses").textContent =
        goodsAfterExpenses.toLocaleString();


    document.getElementById("profit").textContent =
        profit.toLocaleString();

}


function resetCalculator() {

    document.querySelectorAll("input").forEach(function(input) {

        input.value = "";

    });


    document.getElementById("totalBanks").textContent = "0";

    document.getElementById("totalCash").textContent = "0";

    document.getElementById("remaining").textContent = "0";

    document.getElementById("goodsAfterExpenses").textContent = "0";

    document.getElementById("profit").textContent = "0";

}

</script>

</body>

</html>
